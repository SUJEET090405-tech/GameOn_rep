server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kickoff?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:kickoff}
spring.datasource.password=${DB_PASSWORD:kickoff}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

gameon.organizer.api-key=${ORGANIZER_API_KEY:local-gameon-key-change-me}
gameon.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
